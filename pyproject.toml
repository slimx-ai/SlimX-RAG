[project]
name = "slimx-rag"
version = "0.3.0"
description = "SlimX-RAG: a slim, deterministic RAG indexing pipeline (ingest -> chunk -> embed -> index)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "SlimX Team", email = "info@slimx.ai" },
]
dependencies = [
  "langchain-community>=0.4,<1",
  "langchain-core>=1.2,<2",
  "langchain-text-splitters>=1",
  "tqdm>=4.66",
  # Avoid yanked numpy 2.4.0 pulled transitively in some environments
  "numpy<2.4.0",
]

[project.optional-dependencies]
openai = [
  "langchain-openai>=0.2,<1",
]
hf = [
  "sentence-transformers>=3.0,<4",
]
doc = [
  "pypdf>=5.0",
  "python-docx>=1.1",
]
answer = [
  # Exact reviewed SlimX source (the same archive ControlRoom locks); only /api/ask with a real
  # model imports it. Never a moving branch.
  "slimx @ https://github.com/slimx-ai/slimx/archive/e4b7ca30f9b528df477672cfa5911c69b722a556.tar.gz",
]
demo = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # Required by FastAPI to parse multipart/form-data for POST /api/index/file.
  "python-multipart>=0.0.9",
]
faiss = [
  "faiss-cpu>=1.7.4",
]
qdrant = [
  "qdrant-client>=1.7.0",
]
pgvector = [
  "psycopg[binary]>=3.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "build>=1.2",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  # Needed by tests/test_server.py (FastAPI TestClient uses httpx).
  "fastapi>=0.115",
  "httpx>=0.27",
  # Multipart parsing for the file-indexing endpoint test.
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
]

[project.scripts]
slimx-rag = "slimx_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slimx_rag"]

[tool.hatch.metadata]
# The `answer` extra pins SlimX to an exact reviewed source archive (a direct reference).
allow-direct-references = true


[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true
# The CPU release image is qualified with exactly these; the lock is resolved against them.
constraint-dependencies = ["torch==2.7.1", "sentence-transformers==3.4.1"]

# CPU-only torch wheels for the default (and only qualified) image. The GPU Dockerfile
# overrides torch from the CUDA index after the locked sync; it is not part of this release.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "slimx",
  "slimx.*",
  "faiss.*",
  "qdrant_client.*",
  "psycopg.*",
  "sentence_transformers.*",
  "langchain_openai.*",
  "langchain_community.*",
  "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
